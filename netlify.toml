[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://form.typeform.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://form.typeform.com; img-src 'self' data: https://www.facebook.com https://www.google-analytics.com; connect-src 'self' https://form.typeform.com https://www.google-analytics.com https://www.facebook.com"

[[redirects]]
  from = "/takk"
  to = "/takk.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
